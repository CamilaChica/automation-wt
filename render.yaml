services:
  - type: web
    name: backend
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeploy: true
    disk:
      name: winged-api-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: WT_ENV
        value: "production"
      - key: WT_AUTH_ENV
        value: "production"
      - key: WT_AUTH_SECRET
        sync: false
      - key: SALES_EMAIL_USERNAME
        sync: false
      - key: SALES_EMAIL_PASSWORD
        sync: false
      - key: PURCHASING_EMAIL_USERNAME
        sync: false
      - key: PURCHASING_EMAIL_PASSWORD
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: GRAPH_MAILBOX_USER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_MAILBOX_ADDRESS
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: TWILIO_FROM_PHONE_NUMBER
        sync: false
      - key: EMAIL_SEND_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: LLM_DEFAULT_PROVIDER
        value: "openai"
      - key: LLM_LIVE_ENABLED
        value: "true"
      - key: LLM_TASK_PROVIDERS
        value: '{"customer_communication":"openai"}'
      - key: LLM_RETRY_ATTEMPTS
        value: "2"
      - key: LLM_EMAIL_TIMEOUT_SECONDS
        value: "12"
      - key: LLM_ALLOW_TEMPLATE_FALLBACK
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: MAILBOX_MAX_AGE_DAYS
        value: "7"
      - key: CUSTOMER_FOLLOWUP_DELAY_MINUTES
        value: "30"
      - key: SUPPLIER_DISCOUNT_MAX_ROUNDS
        value: "2"
      - key: PURCHASE_ORDER_NOTIFICATION_EMAIL
        value: "camila@wingedtycoons.com"
      - key: CAMILA_NOTIFICATION_EMAIL
        value: "camila@wingedtycoons.com"
      - key: INVENTORY_INGESTION_MAILBOX
        value: "purchasing"
      - key: INVENTORY_INGESTION_POLL_INTERVAL_SECONDS
        value: "60"
      - key: AFTERSHIP_API_KEY
        sync: false
      - key: AFTERSHIP_BASE_URL
        value: "https://api.aftership.com/tracking/2026-07"
      - key: CARRIER_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FREIGHT_ENABLED
        value: "false"
      - key: FREIGHT_PROVIDER
        value: "configured-carrier-api"
      - key: FREIGHT_API_BASE_URL
        sync: false
      - key: FREIGHT_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: OPERATIONS_DB_PATH
        value: "/var/data/operations.db"
      - key: SUPPLIER_DATABASE_PATH
        value: "/var/data/supplier_email_store.db"
      - key: WT_AUTH_DB
        value: "/var/data/winged_tycoons_auth.db"
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        value: "winged-tycoons-backups"
      - key: FRONTEND_ORIGIN
        value: "https://winged-tycoons-frontend.onrender.com,https://wingedtycoons.com,https://rfq.wingedtycoons.com"

  - type: static
    name: frontend
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: winged-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    disk:
      name: winged-worker-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: INVENTORY_INGESTION_WORKER_ENABLED
        value: "true"
      - key: WT_AUTH_ENV
        value: "production"
      - key: WT_AUTH_SECRET
        sync: false
      - key: SALES_EMAIL_USERNAME
        sync: false
      - key: SALES_EMAIL_PASSWORD
        sync: false
      - key: PURCHASING_EMAIL_USERNAME
        sync: false
      - key: PURCHASING_EMAIL_PASSWORD
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: GRAPH_MAILBOX_USER
        sync: false
      - key: EMAIL_SEND_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: LLM_DEFAULT_PROVIDER
        value: "openai"
      - key: LLM_LIVE_ENABLED
        value: "true"
      - key: LLM_TASK_PROVIDERS
        value: '{"customer_communication":"openai"}'
      - key: LLM_RETRY_ATTEMPTS
        value: "2"
      - key: LLM_EMAIL_TIMEOUT_SECONDS
        value: "12"
      - key: LLM_ALLOW_TEMPLATE_FALLBACK
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: MAILBOX_MAX_AGE_DAYS
        value: "7"
      - key: PUBLIC_APP_URL
        sync: false
      - key: OPERATIONS_DB_PATH
        value: "/var/data/operations.db"
      - key: SUPPLIER_DATABASE_PATH
        value: "/var/data/supplier_email_store.db"
      - key: WT_AUTH_DB
        value: "/var/data/winged_tycoons_auth.db"
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        value: "winged-tycoons-backups"

  - type: worker
    name: winged-inventory-ingestion
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.inventory_ingestion_worker
    envVars:
      - key: INVENTORY_INGESTION_POSTGRES_ENABLED
        value: "true"
      - key: INVENTORY_INGESTION_MAILBOX
        value: "purchasing"
      - key: INVENTORY_INGESTION_POLL_INTERVAL_SECONDS
        value: "60"
      - key: PURCHASING_EMAIL_USERNAME
        sync: false
      - key: PURCHASING_EMAIL_PASSWORD
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: GRAPH_MAILBOX_USER
        value: "purchasing@wingedtycoons.com"
      - key: DATABASE_URL
        sync: false
      - key: SUPPLIER_DATABASE_PATH
        value: "/tmp/supplier_email_store.db"
      - key: MAILBOX_MAX_AGE_DAYS
        value: "7"


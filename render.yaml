services:
  - type: web
    name: winged-tycoons-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: WT_AUTH_ENV
        sync: false
      - key: WT_AUTH_SECRET
        sync: false
      - key: SALES_EMAIL_USERNAME
        sync: false
      - key: SALES_EMAIL_PASSWORD
        sync: false
      - key: PURCHASING_EMAIL_USERNAME
        sync: false
      - key: PURCHASING_EMAIL_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: worker
    name: winged-tycoons-mailbox-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: WT_AUTH_SECRET
        sync: false
      - key: SALES_EMAIL_USERNAME
        sync: false
      - key: SALES_EMAIL_PASSWORD
        sync: false
      - key: PURCHASING_EMAIL_USERNAME
        sync: false
      - key: PURCHASING_EMAIL_PASSWORD
        sync: false
      - key: MAILBOX_POLL_INTERVAL_SECONDS
        value: "60"

  - type: web
    name: winged-tycoons-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
